apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-argocd-control
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lukasb27/homelab-argocd-control.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
